<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FFC2D1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF85A1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg1)"/>
  
  <!-- Flower bouquet -->
  <g transform="translate(200, 190)" filter="url(#shadow)">
    <!-- Leaves -->
    <path d="M-40,20 Q-70,-10 -60,-40 Q-30,-20 -40,20" fill="#B7E4C7"/>
    <path d="M40,20 Q70,-10 60,-40 Q30,-20 40,20" fill="#B7E4C7"/>
    
    <!-- Big Peony Center -->
    <circle cx="0" cy="-20" r="45" fill="#FF85A1"/>
    <circle cx="0" cy="-20" r="35" fill="#FFA6C1"/>
    <circle cx="0" cy="-20" r="25" fill="#FFD1DC"/>
    <circle cx="0" cy="-20" r="14" fill="#FFE5EC"/>
    <circle cx="0" cy="-20" r="6" fill="#FFF0F5"/>
    
    <!-- Surrounding Flowers -->
    <!-- Tulip Left -->
    <path d="M-55,-10 C-75,-30 -60,-60 -45,-50 C-35,-60 -20,-30 -40,-10 Z" fill="#FF6584"/>
    <!-- Daisy Right -->
    <g transform="translate(50, -15)">
      <circle cx="0" cy="0" r="8" fill="#FFEAA7"/>
      <ellipse cx="0" cy="-16" rx="5" ry="10" fill="#FFFFFF"/>
      <ellipse cx="14" cy="-8" rx="5" ry="10" transform="rotate(45, 14, -8)" fill="#FFFFFF"/>
      <ellipse cx="16" cy="6" rx="5" ry="10" transform="rotate(90, 16, 6)" fill="#FFFFFF"/>
      <ellipse cx="0" cy="16" rx="5" ry="10" fill="#FFFFFF"/>
      <ellipse cx="-16" cy="6" rx="5" ry="10" transform="rotate(-90, -16, 6)" fill="#FFFFFF"/>
      <ellipse cx="-14" cy="-8" rx="5" ry="10" transform="rotate(-45, -14, -8)" fill="#FFFFFF"/>
    </g>
    
    <!-- Stems -->
    <path d="M0,20 L0,70" stroke="#74C69D" stroke-width="6" stroke-linecap="round"/>
    <path d="M-15,20 L-25,65" stroke="#74C69D" stroke-width="5" stroke-linecap="round"/>
    <path d="M15,20 L25,65" stroke="#74C69D" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Ribbon Bow -->
    <path d="M-20,45 C-40,35 -40,55 -10,48 C-40,65 -15,75 -5,55 Z" fill="#FF6584"/>
    <path d="M20,45 C40,35 40,55 10,48 C40,65 15,75 5,55 Z" fill="#FF6584"/>
    <circle cx="0" cy="48" r="7" fill="#D84A75"/>
  </g>
  
  <!-- Sparkles -->
  <text x="60" y="80" font-size="28">✨</text>
  <text x="310" y="100" font-size="24">🌸</text>
  <text x="70" y="320" font-size="22">🌷</text>
  <text x="300" y="310" font-size="26">✨</text>
  
  <!-- Text -->
  <text x="200" y="350" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#70263E" text-anchor="middle">Blooming Beauty 🌸</text>
  <text x="200" y="375" font-family="'Quicksand', sans-serif" font-weight="500" font-size="13" fill="#A24A68" text-anchor="middle">(Ganti dengan Foto Seyla 1)</text>
</svg>
