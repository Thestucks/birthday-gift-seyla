<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBF1"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg5)"/>
  
  <!-- Pink Tulips Garden -->
  <g transform="translate(200, 200)">
    <!-- Leaves -->
    <path d="M-60,50 Q-80,0 -50,-30 Q-40,20 -60,50" fill="#95D5B2"/>
    <path d="M-10,50 Q-30,-20 0,-50 Q10,10 -10,50" fill="#74C69D"/>
    <path d="M40,50 Q20,-10 50,-40 Q60,10 40,50" fill="#95D5B2"/>
    
    <!-- Left Tulip -->
    <g transform="translate(-45, -15)">
      <path d="M-16,0 C-24,-24 -12,-40 0,-34 C12,-40 24,-24 16,0 Z" fill="#FF85A1"/>
      <path d="M-10,0 C-18,-18 -6,-30 0,-25 C6,-30 18,-18 10,0 Z" fill="#FFB3C6"/>
    </g>
    
    <!-- Middle Big Tulip -->
    <g transform="translate(0, -45)">
      <path d="M-22,0 C-32,-32 -16,-52 0,-44 C16,-52 32,-32 22,0 Z" fill="#FF6584"/>
      <path d="M-14,0 C-22,-24 -8,-40 0,-34 C8,-40 22,-24 14,0 Z" fill="#FFA6C1"/>
    </g>
    
    <!-- Right Tulip -->
    <g transform="translate(45, -20)">
      <path d="M-16,0 C-24,-24 -12,-40 0,-34 C12,-40 24,-24 16,0 Z" fill="#FF85A1"/>
      <path d="M-10,0 C-18,-18 -6,-30 0,-25 C6,-30 18,-18 10,0 Z" fill="#FFB3C6"/>
    </g>
  </g>
  
  <text x="200" y="350" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#70263E" text-anchor="middle">Blooming Tulips 🌷</text>
  <text x="200" y="375" font-family="'Quicksand', sans-serif" font-weight="500" font-size="13" fill="#A24A68" text-anchor="middle">(Ganti dengan Foto Seyla 5)</text>
</svg>
