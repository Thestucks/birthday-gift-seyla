<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FFB3C6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg3)"/>
  
  <!-- Birthday Cake 23 -->
  <g transform="translate(200, 205)">
    <!-- Plate -->
    <ellipse cx="0" cy="55" rx="85" ry="16" fill="#FFFFFF" opacity="0.9"/>
    <!-- Bottom Tier -->
    <rect x="-65" y="0" width="130" height="50" rx="10" fill="#FFFDF9"/>
    <!-- Pink Icing Dripping -->
    <path d="M-65,0 C-50,20 -40,0 -20,22 C0,2 15,22 35,0 C50,20 55,0 65,10 L65,0 Z" fill="#FF85A1"/>
    <!-- Top Tier -->
    <rect x="-45" y="-35" width="90" height="35" rx="8" fill="#FFFDF9"/>
    <path d="M-45,-35 C-30,-20 -20,-35 -5,-18 C10,-35 25,-18 35,-35 L45,-30 L45,-35 Z" fill="#FFA6C1"/>
    
    <!-- Candles -->
    <!-- Candle 2 -->
    <rect x="-20" y="-62" width="6" height="27" rx="3" fill="#FF6584"/>
    <ellipse cx="-17" cy="-70" rx="5" ry="8" fill="#FFEAA7"/>
    <ellipse cx="-17" cy="-70" rx="2" ry="4" fill="#FF7675"/>
    <!-- Candle 3 -->
    <rect x="14" y="-62" width="6" height="27" rx="3" fill="#FF6584"/>
    <ellipse cx="17" cy="-70" rx="5" ry="8" fill="#FFEAA7"/>
    <ellipse cx="17" cy="-70" rx="2" ry="4" fill="#FF7675"/>
    
    <!-- Number 23 Badge -->
    <circle cx="0" cy="18" r="16" fill="#FF85A1"/>
    <text x="0" y="24" font-family="'Quicksand', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">23</text>
  </g>
  
  <text x="65" y="90" font-size="24">🎂</text>
  <text x="315" y="85" font-size="24">🎉</text>
  
  <text x="200" y="350" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#70263E" text-anchor="middle">Sweet 23rd Birthday 🎂</text>
  <text x="200" y="375" font-family="'Quicksand', sans-serif" font-weight="500" font-size="13" fill="#A24A68" text-anchor="middle">(Ganti dengan Foto Seyla 3)</text>
</svg>
