<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4EC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg4)"/>
  
  <!-- Polaroid Camera with Flower Accent -->
  <g transform="translate(200, 195)">
    <!-- Body -->
    <rect x="-65" y="-50" width="130" height="100" rx="24" fill="#FFFFFF" stroke="#FFA6C1" stroke-width="3"/>
    <!-- Top Flash & Viewfinder -->
    <rect x="-45" y="-40" width="22" height="14" rx="4" fill="#FF85A1"/>
    <circle cx="45" cy="-33" r="7" fill="#B7E4C7"/>
    <!-- Lens -->
    <circle cx="0" cy="5" r="36" fill="#FFF0F5" stroke="#FF85A1" stroke-width="4"/>
    <circle cx="0" cy="5" r="26" fill="#FFA6C1"/>
    <circle cx="0" cy="5" r="16" fill="#70263E"/>
    <circle cx="-5" cy="0" r="5" fill="#FFFFFF"/>
    
    <!-- Flower on Camera corner -->
    <g transform="translate(55, -45)">
      <circle cx="0" cy="0" r="5" fill="#FFEAA7"/>
      <circle cx="0" cy="-9" r="6" fill="#FF85A1"/>
      <circle cx="9" cy="0" r="6" fill="#FF85A1"/>
      <circle cx="0" cy="9" r="6" fill="#FF85A1"/>
      <circle cx="-9" cy="0" r="6" fill="#FF85A1"/>
    </g>
  </g>
  
  <text x="200" y="350" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#70263E" text-anchor="middle">Precious Memories 📸</text>
  <text x="200" y="375" font-family="'Quicksand', sans-serif" font-weight="500" font-size="13" fill="#A24A68" text-anchor="middle">(Ganti dengan Foto Seyla 4)</text>
</svg>
