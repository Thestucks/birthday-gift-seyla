<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg2)"/>
  
  <!-- Sweet Drink & Flowers -->
  <g transform="translate(200, 190)">
    <!-- Cup -->
    <path d="M-40,-30 L40,-30 L30,50 C30,65 -30,65 -30,50 Z" fill="#FFFFFF" stroke="#FFA6C1" stroke-width="3"/>
    <!-- Drink Content -->
    <path d="M-35,-20 L35,-20 L28,45 C28,58 -28,58 -28,45 Z" fill="#FF85A1" opacity="0.8"/>
    <!-- Straw -->
    <rect x="5" y="-75" width="8" height="60" rx="4" fill="#B7E4C7" transform="rotate(15)"/>
    <!-- Whipped Cream & Heart -->
    <ellipse cx="0" cy="-30" rx="42" ry="12" fill="#FFFFFF"/>
    <text x="0" y="-35" font-size="28" text-anchor="middle">🍓</text>
    
    <!-- Floating Hearts -->
    <text x="-60" y="-10" font-size="20">💖</text>
    <text x="55" y="10" font-size="22">✨</text>
  </g>
  
  <text x="200" y="350" font-family="'Quicksand', sans-serif" font-weight="700" font-size="18" fill="#70263E" text-anchor="middle">Sweet Smile & Good Vibes 🧋</text>
  <text x="200" y="375" font-family="'Quicksand', sans-serif" font-weight="500" font-size="13" fill="#A24A68" text-anchor="middle">(Ganti dengan Foto Seyla 2)</text>
</svg>
